<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Administración{% endblock %} | QuieroTuJersey</title>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            max-width: 1000px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 20px;
            background: #1e293b;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        nav .marca {
            color: #fbbf24;
            font-weight: bold;
            margin-right: auto;
        }

        nav form {
            margin: 0;
        }

        h1 {
            color: #60a5fa;
        }

        a {
            color: #93c5fd;
            text-decoration: none;
        }

        .tarjeta {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #334155;
            vertical-align: middle;
        }

        th {
            color: #94a3b8;
            font-size: 14px;
        }

        .numero {
            text-align: right;
        }

        .boton {
            display: inline-block;
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            background: #3b82f6;
        }

        .boton:hover {
            background: #2563eb;
        }

        .boton.verde {
            background: #16a34a;
        }

        .boton.rojo {
            background: #ef4444;
        }

        .boton.gris {
            background: #475569;
        }

        .acciones {
            display: flex;
            gap: 8px;
        }

        .acciones form {
            margin: 0;
        }

        .etiqueta {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .etiqueta.activo,
        .etiqueta.confirmado {
            background: #14532d;
            color: #4ade80;
        }

        .etiqueta.inactivo,
        .etiqueta.cancelado {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .etiqueta.pendiente {
            background: #78350f;
            color: #fcd34d;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .alerta {
            background: #334155;
            color: #fbbf24;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        {% if session.get('admin') %}
            <nav>
                <span class="marca">QuieroTuJersey · Admin</span>
                <a href="{{ url_for('admin_jerseys') }}">Jerseys</a>
                <a href="{{ url_for('admin_pedidos') }}">Pedidos</a>
                <a href="{{ url_for('inicio') }}">Ver tienda</a>
                <form method="POST" action="{{ url_for('admin_logout') }}">
                    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
                    <button class="boton gris" type="submit">Cerrar sesión</button>
                </form>
            </nav>
        {% endif %}

        {% for mensaje in get_flashed_messages() %}
            <div class="alerta">{{ mensaje }}</div>
        {% endfor %}

        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
