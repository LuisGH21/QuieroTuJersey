{% extends "admin_base.html" %}

{% block titulo %}Acceso de administrador{% endblock %}

{% block contenido %}
    <div class="tarjeta" style="max-width: 420px; margin: 80px auto;">
        <h1>Administración</h1>

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                autocomplete="current-password"
                required
                autofocus
            >

            <p>
                <button class="boton" type="submit">Entrar</button>
            </p>
        </form>

        <a href="{{ url_for('inicio') }}">← Volver a la tienda</a>
    </div>
{% endblock %}
