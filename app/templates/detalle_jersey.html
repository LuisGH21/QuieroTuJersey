
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ jersey.equipo }} | QuieroTuJersey</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .producto {
            max-width: 650px;
            margin: 40px auto;
            padding: 35px;
            background: #1e293b;
            border-radius: 14px;
        }

        h1 {
            color: #60a5fa;
        }

        .precio {
            color: #4ade80;
            font-size: 28px;
            font-weight: bold;
        }

        .campo {
            margin: 22px 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .boton {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover {
            background: #2563eb;
        }

        .boton:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        .mensaje {
            margin-top: 18px;
            font-weight: bold;
        }

        .alerta {
            padding: 12px;
            margin: 15px 0;
            background: #334155;
            border-radius: 8px;
            color: #fbbf24;
        }

        a {
            color: #93c5fd;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="producto">
        <a href="{{ url_for('mostrar_jerseys') }}">
            ← Volver al catálogo
        </a>

        <p>
            <a href="{{ url_for('ver_carrito') }}">
                Ver carrito de compras
            </a>
        </p>

        <h1>{{ jersey.equipo }}</h1>
        <h2>Jersey {{ jersey.tipo }}</h2>

        <p>Temporada: {{ jersey.temporada }}</p>
        <p>{{ jersey.descripcion }}</p>

        <p class="precio">
            ${{ jersey.precio }} MXN
        </p>

        {% for mensaje in get_flashed_messages() %}
            <div class="alerta">{{ mensaje }}</div>
        {% endfor %}

        <form
            method="POST"
            action="{{ url_for('agregar_al_carrito', id_jersey=jersey.id) }}"
        >
            <div class="campo">
                <label for="talla">Selecciona tu talla</label>

                <select id="talla" name="talla" required>
                    <option value="">Selecciona una talla</option>

                    {% for talla, stock in tallas %}
                        <option
                            value="{{ talla }}"
                            data-stock="{{ stock }}"
                            {% if stock == 0 %}disabled{% endif %}
                        >
                            {{ talla }} — {{ stock }} disponibles
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label for="cantidad">Cantidad</label>

                <input
                    type="number"
                    id="cantidad"
                    name="cantidad"
                    min="1"
                    step="1"
                    value="1"
                    required
                >
            </div>

            <button class="boton" id="agregar" type="submit" disabled>
                Agregar al carrito
            </button>

            <p class="mensaje" id="mensaje"></p>
        </form>
    </div>

    <script>
        const talla = document.getElementById("talla");
        const cantidad = document.getElementById("cantidad");
        const boton = document.getElementById("agregar");
        const mensaje = document.getElementById("mensaje");

        function validarSeleccion() {
            const opcion = talla.options[talla.selectedIndex];
            const stock = Number(opcion.dataset.stock || 0);
            const unidades = Number(cantidad.value);

            if (talla.value === "") {
                cantidad.removeAttribute("max");
                boton.disabled = true;
                mensaje.textContent = "Selecciona una talla.";
                return;
            }

            cantidad.max = stock;

            if (
                cantidad.value === "" ||
                !Number.isInteger(unidades) ||
                unidades < 1 ||
                unidades > stock
            ) {
                boton.disabled = true;
                mensaje.textContent =
                    "Cantidad no válida. Disponibles: " + stock;
                return;
            }

            boton.disabled = false;
            mensaje.textContent =
                "Disponibles: " + stock + " unidades.";
        }

        talla.addEventListener("change", validarSeleccion);
        cantidad.addEventListener("input", validarSeleccion);

        validarSeleccion();
    </script>
</body>
</html>
