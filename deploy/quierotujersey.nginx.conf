# =============================================================
# QuieroTuJersey - sitio de NGINX (proxy inverso hacia Gunicorn)
# Ubuntu/Debian: /etc/nginx/sites-available/quierotujersey
# Fedora/RHEL:   /etc/nginx/conf.d/quierotujersey.conf
# =============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/quierotujersey.access.log;
    error_log  /var/log/nginx/quierotujersey.error.log;

    client_max_body_size 1m;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
